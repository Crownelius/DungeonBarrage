# CI gates for Dungeon Barrage.
#
# This workflow is the enforcement mechanism for docs/SECURITY_BASELINE.md §10. A control
# that is documented but not gated is an intention, not a control — everything in that
# section that CAN be automated is automated here.
#
# The web/npm job was removed with the TypeScript surface (ADR 0004). The Godot-free C#
# contracts/interop solution is gated below against a freshly built native core.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  rust:
    name: Rust core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        run: rustup toolchain install 1.94.0 --profile minimal --component clippy,rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --workspace --locked

      - name: Test FFI unwind guard in the shipped profile
        run: cargo test --release -p db-sim-ffi --locked

      - name: Build FFI cdylib
        run: cargo build --release -p db-sim-ffi --locked

      - name: Verify the exact gameplay export surface
        shell: bash
        run: |
          actual=$(nm -D --defined-only target/release/libdb_sim_ffi.so \
            | awk '{print $3}' \
            | grep '^db_sim_' \
            | sort)
          expected=$(printf '%s\n' \
            db_sim_abi_version \
            db_sim_buffer_free \
            db_sim_content_version \
            db_sim_match_apply \
            db_sim_match_bot_decide \
            db_sim_match_create \
            db_sim_match_destroy \
            db_sim_match_preview \
            db_sim_match_snapshot \
            db_sim_match_terrain \
            db_sim_match_timeout \
            db_sim_roster \
            db_sim_simulation_version \
            | sort)
          if [ "$actual" != "$expected" ]; then
            printf 'Expected exports:\n%s\nActual exports:\n%s\n' "$expected" "$actual"
            exit 1
          fi

      - name: Leak-check the complete FFI ownership cycle
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes valgrind
          test_binary=$(cargo test --release -p db-sim-ffi --locked --no-run --message-format=json \
            | jq -r 'select(.reason == "compiler-artifact" and .profile.test == true and .target.name == "db_sim_ffi") | .executable' \
            | tail -n 1)
          test -n "$test_binary"
          valgrind \
            --leak-check=full \
            --show-leak-kinds=definite,indirect \
            --errors-for-leak-kinds=definite,indirect \
            --error-exitcode=1 \
            "$test_binary" \
            --exact tests::repeated_create_apply_preview_snapshot_terrain_and_destroy_cycles_complete_cleanly

  client:
    name: C# contracts and native interop
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        run: rustup toolchain install 1.94.0 --profile minimal

      - uses: Swatinem/rust-cache@v2

      - name: Build native authority
        run: cargo build --release -p db-sim-ffi --locked

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore locked dependencies
        run: dotnet restore client/DungeonBarrage.sln --locked-mode

      - name: Build
        run: dotnet build client/DungeonBarrage.sln -c Release --no-restore

      - name: Verify Linux native test payload
        run: test -f client/tests/DungeonBarrage.Client.Interop.Tests/bin/Release/net10.0/libdb_sim_ffi.so

      - name: Test
        run: dotnet test client/DungeonBarrage.sln -c Release --no-build

      - name: Format
        run: dotnet format client/DungeonBarrage.sln --verify-no-changes --no-restore

  memory-safety:
    name: Memory safety invariants
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install 1.94.0 --profile minimal
      - uses: Swatinem/rust-cache@v2

      # ADR 0001 §1. Grepped rather than assumed: a dropped `forbid` line would silently
      # reopen the entire class of bug that motivated choosing Rust over C++.
      - name: Workspace forbids unsafe
        run: |
          grep -q 'unsafe_code = "forbid"' Cargo.toml \
            || { echo "::error::workspace lint 'unsafe_code = forbid' is missing"; exit 1; }

      # `unsafe` is permitted in exactly one crate — the FFI boundary — because a C ABI
      # cannot be written without it (ADR 0004). Anywhere else is a regression.
      - name: Unsafe appears only in the FFI crate
        run: |
          hits=$(grep -rln --include='*.rs' -E '(^|[^_[:alnum:]])unsafe[[:space:]]*(\{|fn|extern)' crates/ \
                 | grep -v '^crates/db-sim-ffi/' || true)
          if [ -n "$hits" ]; then
            echo "$hits"
            echo "::error::unsafe found outside crates/db-sim-ffi"
            exit 1
          fi

      # An undocumented unsafe block is an unreviewable one. clippy enforces this inside the
      # FFI crate via undocumented_unsafe_blocks; this checks the lint is still configured.
      - name: FFI crate requires safety documentation
        run: |
          grep -q 'undocumented_unsafe_blocks = "deny"' crates/db-sim-ffi/Cargo.toml \
            || { echo "::error::db-sim-ffi must deny undocumented_unsafe_blocks"; exit 1; }

      # Determinism invariant (ADR 0001 §4). Floating point in the authoritative core breaks
      # bit-exact reproducibility across targets. Comment lines are stripped first — the
      # modules that document this rule naturally mention f32/f64, and a gate that trips on
      # its own documentation trains people to disable it.
      - name: No floating point in the core
        run: |
          hits=$(grep -rn --include='*.rs' -E '\b(f32|f64)\b' crates/db-sim-core/src/ \
                 | grep -vE ':[0-9]+:[[:space:]]*(//|/\*|\*)' || true)
          if [ -n "$hits" ]; then
            echo "$hits"
            echo "::error::floating point found in the authoritative simulation core"
            exit 1
          fi

  supply-chain:
    name: Supply chain
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: a secret committed and then removed is still leaked and still
          # needs rotating at its source.
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
