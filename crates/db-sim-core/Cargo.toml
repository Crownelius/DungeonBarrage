[package]
name = "db-sim-core"
description = "Authoritative deterministic simulation core for Dungeon Barrage."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# The core is intentionally dependency-free. Every crate added here becomes part of
# the authoritative trust boundary (SECURITY_BASELINE.md §8) and requires justification.
[dependencies]

[dev-dependencies]
# Shared fixture manifests are JSON because the future C# -> FFI test must consume the
# exact same bytes. Serialization stays test-only here; production wire DTOs belong to the
# separate FFI adapter so the authoritative core remains dependency-free.
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lints]
workspace = true
